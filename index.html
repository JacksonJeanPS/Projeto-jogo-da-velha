<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./styles.css">
        <title>Jogo da Velha</title>
    </head>
    <body>
        <main class="game-container">
            <h1 class="game-title">Jogo da Velha</h1>

            <div class="status" data-status>
                <span class="status-text">Vez de:</span>
                <span class="player-indicator" data-player-indicator>X</span>
            </div>

            <div class="board" data-board>
                <div class="cell" data-cell data-index="0"></div>
                <div class="cell" data-cell data-index="1"></div>
                <div class="cell" data-cell data-index="2"></div>
                <div class="cell" data-cell data-index="3"></div>
                <div class="cell" data-cell data-index="4"></div>
                <div class="cell" data-cell data-index="5"></div>
                <div class="cell" data-cell data-index="6"></div>
                <div class="cell" data-cell data-index="7"></div>
                <div class="cell" data-cell data-index="8"></div>
            </div>

            <button class="restart-btn" data-restart-button type="button">
                Reiniciar
            </button>

            <div class="winning-message" data-winning-message>
                <p class="winning-message-text" data-winning-message-text></p>
                <button class="winning-message-button" data-winning-message-button type="button">
                    Reiniciar
                </button>
            </div>
        </main>

        <script src="./script.js"></script>
    </body>
</html>
