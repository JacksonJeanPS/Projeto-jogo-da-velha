<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./styles.css">
        <title>Jogo da Velha</title>
    </head>
    <body>
        <main class="game-container">
            <header class="game-header">
                <h1 class="game-title">Jogo da Velha</h1>
                <button class="sound-toggle" data-sound-toggle type="button" aria-label="Ativar ou desativar som">
                    <span class="sound-icon" data-sound-icon>🔊</span>
                </button>
            </header>

            <div class="mode-selector" data-mode-selector>
                <button class="mode-btn active" data-mode-btn value="pvp" type="button" aria-pressed="true">Jogador vs Jogador</button>
                <button class="mode-btn" data-mode-btn value="pvc" type="button" aria-pressed="false">Jogador vs Computador</button>
            </div>

            <div class="score-board" data-score-board>
                <div class="score-item">
                    <span class="score-label">X</span>
                    <span class="score-value" data-score-x>0</span>
                </div>
                <div class="score-item">
                    <span class="score-label">Empates</span>
                    <span class="score-value" data-score-draw>0</span>
                </div>
                <div class="score-item">
                    <span class="score-label">O</span>
                    <span class="score-value" data-score-o>0</span>
                </div>
            </div>
            <button class="clear-score-btn" data-clear-score type="button" aria-label="Limpar placar">
                Limpar placar
            </button>

            <div class="status" data-status aria-live="polite" aria-atomic="true">
                <span class="status-text">Vez de:</span>
                <span class="player-indicator" data-player-indicator>X</span>
            </div>

            <div class="board" data-board role="grid" aria-label="Tabuleiro do jogo da velha" tabindex="0">
                <div class="cell" data-cell data-index="0" role="gridcell" tabindex="-1" aria-label="Posição 1, 1 - Vazia"></div>
                <div class="cell" data-cell data-index="1" role="gridcell" tabindex="-1" aria-label="Posição 1, 2 - Vazia"></div>
                <div class="cell" data-cell data-index="2" role="gridcell" tabindex="-1" aria-label="Posição 1, 3 - Vazia"></div>
                <div class="cell" data-cell data-index="3" role="gridcell" tabindex="-1" aria-label="Posição 2, 1 - Vazia"></div>
                <div class="cell" data-cell data-index="4" role="gridcell" tabindex="-1" aria-label="Posição 2, 2 - Vazia"></div>
                <div class="cell" data-cell data-index="5" role="gridcell" tabindex="-1" aria-label="Posição 2, 3 - Vazia"></div>
                <div class="cell" data-cell data-index="6" role="gridcell" tabindex="-1" aria-label="Posição 3, 1 - Vazia"></div>
                <div class="cell" data-cell data-index="7" role="gridcell" tabindex="-1" aria-label="Posição 3, 2 - Vazia"></div>
                <div class="cell" data-cell data-index="8" role="gridcell" tabindex="-1" aria-label="Posição 3, 3 - Vazia"></div>
            </div>

            <button class="restart-btn" data-restart-button type="button" aria-label="Reiniciar jogo">
                Reiniciar
            </button>

            <div class="winning-message" data-winning-message role="dialog" aria-modal="true" aria-labelledby="winning-message-text" aria-hidden="true">
                <p id="winning-message-text" class="winning-message-text" data-winning-message-text></p>
                <button class="winning-message-button" data-winning-message-button type="button" aria-label="Reiniciar jogo">
                    Reiniciar
                </button>
            </div>
        </main>

        <script src="./script.js"></script>
    </body>
</html>
